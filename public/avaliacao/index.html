<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Avaliação — TECH</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<nav class="navbar">
  <div class="brand">TE<span>CH</span></div>
  <div class="links">
    <a href="/index.html">Início</a>
    <a href="/avaliacao/" class="active">Avaliação</a>
    <a href="/pesquisa/">Pesquisa</a>
  </div>
</nav>

<main>
  <div class="form-header">
    <h1 id="titulo-form">Avaliação</h1>
    <p id="descricao-form">Carregando...</p>
  </div>

  <div class="progress-bar"><div id="progress"></div></div>

  <div id="alerta"></div>

  <form id="form-avaliacao">
    <fieldset>
      <legend>Identificação</legend>
      <div class="field">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" required autocomplete="name" />
      </div>
      <div class="field">
        <label for="idade">Idade</label>
        <input type="number" id="idade" name="idade" min="1" max="120" />
      </div>
      <div class="field">
        <label for="serie">Série / Ano escolar</label>
        <input type="text" id="serie" name="serie" placeholder="Ex: 8º ano, 2º ano EM..." />
      </div>
      <div class="field">
        <label for="turma">Turma (opcional)</label>
        <input type="text" id="turma" name="turma" placeholder="Ex: 8A" />
      </div>
    </fieldset>

    <fieldset>
      <legend>Questões</legend>
      <div id="questoes-container"></div>
    </fieldset>

    <div class="submit-row">
      <button type="submit" class="btn btn-primary" id="btn-enviar">Enviar avaliação</button>
    </div>
  </form>
</main>

<footer>TECH — Technological Competency for Humans</footer>

<script src="/js/form-common.js"></script>
<script src="/avaliacao/avaliacao.js"></script>
</body>
</html>
